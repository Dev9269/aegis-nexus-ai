name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AEGIS_ENVIRONMENT: test
      AEGIS_DATABASE_URL: sqlite:///./ci.db
      AEGIS_DEMO_MODE: "true"
      AEGIS_DEMO_PASSWORD: "CI-Demo-Password!2026"
      AEGIS_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app scripts
      - name: Verify migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Audit Python dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check generated API types
        run: npm run api:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Build production bundle
        env:
          VITE_DEMO_MODE: "false"
          VITE_DEMO_PASSWORD: ""
        run: npm run build
      - name: Verify no demo password in bundle
        run: npm run check:build-secrets

  e2e:
    runs-on: ubuntu-latest
    env:
      AEGIS_ENVIRONMENT: test
      AEGIS_DATABASE_URL: sqlite:///./e2e.db
      AEGIS_DEMO_MODE: "true"
      AEGIS_DEMO_PASSWORD: "CI-Demo-Password!2026"
      AEGIS_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run e2e
